<div class="flex items-center justify-center min-h-screen bg-gradient-to-br from-gray-900 to-gray-700 px-4">
    <div class="relative bg-gray-800 p-8 rounded-xl shadow-xl w-full max-w-sm text-white">
      
      <!-- Back to Home Button (Icon on Mobile) -->
    
  
      <h2 class="text-2xl font-extrabold text-center mb-4">Create an Account</h2>
      <form [formGroup]="form" (ngSubmit)="onSignUp()">
        <!-- Name Field -->
        <div class="mb-3">
          <label class="block text-gray-300 font-medium mb-1" for="name">Full Name</label>
          <input type="text" id="name" placeholder="Enter your name" formControlName="name"
            class="w-full px-3 py-2 bg-gray-700 border border-gray-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 placeholder-gray-400 text-white">
        </div>
  
        <!-- Email Field -->
        <div class="mb-3">
          <label class="block text-gray-300 font-medium mb-1" for="email">Email</label>
          <input type="email" id="email" placeholder="Enter your email" formControlName="email"
            class="w-full px-3 py-2 bg-gray-700 border border-gray-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 placeholder-gray-400 text-white">
        </div>
  
        <!-- Mobile Number Field -->
        <div class="mb-3">
          <label class="block text-gray-300 font-medium mb-1" for="mobile">Mobile Number</label>
          <input type="tel" id="mobile" placeholder="Enter your mobile number" formControlName="mobile"
            class="w-full px-3 py-2 bg-gray-700 border border-gray-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 placeholder-gray-400 text-white">
        </div>
  
        <!-- Password & Confirm Password (Side by Side) -->
        <div class="flex flex-col sm:flex-row gap-3">
          <div class="w-full sm:w-1/2">
            <label class="block text-gray-300 font-medium mb-1" for="password">Password</label>
            <input type="password" id="password" placeholder="Password" formControlName="password"
              class="w-full px-3 py-2 bg-gray-700 border border-gray-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 placeholder-gray-400 text-white">
          </div>
          <div class="w-full sm:w-1/2">
            <label class="block text-gray-300 font-medium mb-1" for="confirm-password">Confirm</label>
            <input type="password" id="confirm-password" placeholder="Confirm" formControlName="confirmPassword"
              class="w-full px-3 py-2 bg-gray-700 border border-gray-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 placeholder-gray-400 text-white">
          </div>
        </div>
  
        <!-- Sign Up Button -->
        <button type="submit"
          class="w-full mt-4 bg-blue-600 text-white font-bold py-2 rounded-lg hover:bg-blue-500 transition duration-200">
          Sign Up
        </button>
      </form>
  
      <!-- Already have an account? -->
      <p class="text-sm text-center text-gray-400 mt-3">Already have an account? 
        <a [routerLink]="['/home/user/userLogin']" class="text-blue-400 hover:underline">Sign in</a>
      </p>
  
      <button [routerLink]="['/home']"
      class="w-full mt-4 bg-gray-700 text-white font-bold py-2 rounded-lg hover:bg-gray-600 transition duration-200">
      Back to Home
    </button>

    </div>
  </div>
