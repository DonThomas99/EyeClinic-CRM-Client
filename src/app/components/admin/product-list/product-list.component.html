<app-admin-header></app-admin-header>

<div class="container mx-auto p-6">
  <!-- Header with Buttons -->
  <div class="flex justify-between items-center mb-4">
    <h1 class="text-2xl font-semibold text-gray-800">Product List</h1>
    <div>
      <button 
        (click)="addProduct()"
        class="bg-blue-500 hover:bg-blue-600 cursor-pointer text-white font-semibold py-2 px-4 rounded mr-2"
      >
        Add Product
      </button>
      <button 
        (click)="viewCategories()"
        class="bg-gray-500 hover:bg-gray-600 cursor-pointer text-white font-semibold py-2 px-4 rounded mr-2"
      >
  Categories
      </button>
      <button [routerLink]="['/home/admin/brandList']"
      class="bg-blue-500 hover:bg-blue-600 cursor-pointer text-white font-semibold py-2 px-4 rounded "
      >
      Brands
      </button>
    </div>
  </div>

  <!-- Product Table -->
  <div class="overflow-x-auto bg-white shadow-md rounded-lg">
    <table class="min-w-full border border-gray-200">
      <thead class="bg-gray-100">
        <tr>
          <th class="px-6 py-3 text-left text-sm font-semibold text-gray-600">Name</th>
          <th class="px-6 py-3 text-left text-sm font-semibold text-gray-600">Price</th>
          <th class="px-6 py-3 text-left text-sm font-semibold text-gray-600">Category</th>
          <th class="px-6 py-3 text-left text-sm font-semibold text-gray-600">Brand</th>
          <th class="px-6 py-3 text-left text-sm font-semibold text-gray-600">Stock</th>
          <th class="px-6 py-3 text-left text-sm font-semibold text-gray-600">Status</th>
          <th class="px-6 py-3 text-left text-sm font-semibold text-gray-600">Details</th>
          <th class="px-6 py-3 text-center text-sm font-semibold text-gray-600">Action</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let product of products" class="border-b hover:bg-gray-50">
          <td class="px-6 py-4">{{ product.name }}</td>
          <td class="px-6 py-4">₹{{ product.price }}</td>
          <td class="px-6 py-4">{{ product.category.name }}</td>
          <td class="px-6 py-4">{{product.brand.name}}</td>
          <td class="px-6 py-4">{{ product.stock }}</td>
          <td class="py-3 px-4">
            <button 
            [ngClass]="product.isBlocked ? 'bg-red-600 hover:bg-red-700' : 'bg-green-600 hover:bg-green-700'"
            class="text-white px-3 py-1 rounded-md hover:cursor-pointer"
            (click)="toggleBlockStatus(product._id,product.isBlocked)">
            {{ product.isBlocked ? 'Unblock' : 'Block' }}
            
          </button>
        </td>

        <td class="px-6 py-4 text-center">
          <button onclick="my_modal_1.showModal()" class="btn" (click)="openDetails(product.description)">
            DETAILS
          </button>
      </td>

          <td class="px-6 py-4 text-center">
            <button
              (click)="editProduct(product._id)"
              class="bg-yellow-500 hover:bg-yellow-600 text-white font-semibold py-1 px-3 rounded"
            >
              EDIT
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>


<dialog #addModal id="my_modal_1" class="modal">
  <div class="modal-box h-1/2 w-full">
    <div>
      <form  method="dialog">
        <button class="btn btn-sm btn-circle btn-ghost absolute right-2 top-2" (click)="closeDetails()">✕</button>
     <h3>
{{productDescription}}
     </h3>
      </form>
    </div>
  </div>
</dialog>
