<app-admin-header></app-admin-header>

<div class="container mx-auto p-6">
    <h1 class="text-2xl font-semibold text-gray-800 mb-4">Customer List</h1>
  
    <div class="overflow-x-auto bg-white shadow-md rounded-lg">
      <table class="min-w-full border border-gray-200">
        <thead class="bg-gray-100">
          <tr>
            <th class="px-6 py-3 text-left text-sm font-semibold text-gray-600">Name</th>
            <th class="px-6 py-3 text-left text-sm font-semibold text-gray-600">Email</th>
            <th class="px-6 py-3 text-left text-sm font-semibold text-gray-600">Mobile</th>
            <th class="px-6 py-3 text-left text-sm font-semibold text-gray-600">Status</th>
            <th class="px-6 py-3 text-center text-sm font-semibold text-gray-600">Action</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let customer of customers" class="border-b hover:bg-gray-50">
            <td class="px-6 py-4">{{ customer.name }}</td>
            <td class="px-6 py-4">{{ customer.email }}</td>
            <td class="px-6 py-4">{{ customer.mobile }}</td>
            <td class="py-3 px-4">
              <button 
              [ngClass]="customer.isBlocked ? 'bg-red-600 hover:bg-red-700' : 'bg-green-600 hover:bg-green-700'"
              class="text-white px-3 py-1 rounded-md hover:cursor-pointer"
              (click)="toggleBlockStatus(customer.email,customer.isBlocked)">
              {{ customer.isBlocked ? 'Unblock' : 'Block' }}
              
            </button>
          </td>
            <td class="px-6 py-4 text-center">
              <button
                (click)="viewCustomer(customer._id)" 
                class="bg-blue-500 hover:bg-blue-600 text-white font-semibold py-1 px-3 rounded"
              >
                View Details
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
