<app-admin-header></app-admin-header>

<div class="container mx-auto p-6">
<div class="flex justify-between items-center mb-4">
    <button 
    class="bg-gray-600 text-white px-4 py-2 rounded-md hover:bg-gray-700 cursor-pointer"
    [routerLink]="['/home/admin/productList']">Back To Products</button>
    <h2 class="text-2xl font-semibold">CategoryList</h2>
    <button onclick="addBrand.showModal()" class="bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700">Add Brand</button>
</div>

<!-- Brand Table -->
<div class="bg-white shadow-md rounded-lg overflow-hidden">
    <table class="min-w-full bg-white border border-gray-200">
      <thead>
        <tr class="bg-gray-100 border-b">
          <th class="text-left py-3 px-4 font-semibold text-gray-700">Name</th>
          <th class="text-left py-3 px-4 font-semibold text-gray-700">Status</th>
          <th class="text-left py-3 px-4 font-semibold text-gray-700">Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let brand of brands" class="border-b">
          <td class="py-3 px-4">{{ brand.name }}</td>
          
          <!-- Status Badge -->
          <td class="py-3 px-4">
              <button 
              [ngClass]="brand.isBlocked ? 'bg-red-600 hover:bg-red-700' : 'bg-green-600 hover:bg-green-700'"
              class="text-white px-3 py-1 rounded-md hover:cursor-pointer"
              (click)="toggleBlockStatus(brand._id,brand.isBlocked)">
              {{ brand.isBlocked ? 'Unblock' : 'Block' }}
              
            </button>
          </td>

          <!-- Actions (Edit & Block/Unblock) -->
          <td class="py-3 px-4 flex space-x-2">
            <button 
              class="bg-yellow-500 text-white px-3 py-1 rounded-md hover:bg-yellow-600 cursor-pointer"
              (click)="editBrand(brand._id)">
              Edit
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<dialog id="addBrand" class="modal">
<div class="modal-box w-1/2 max-w-2.5xl">
<h3 class="text-lg font-bold">Add Brand</h3>
<div>
    <form [formGroup]="addBrandForm" (ngSubmit)="addBrand()" method="dialog">
        <button class="btn btn-sm btn-circle btn-ghost absolute right-2 top-2">✕</button>
        <div class="flex justify-evenly">
            <input type="text" id="brandName" name="brandName" class="input input-bordered w-1/2 mt-2" formControlName="brandName" placeholder="Enter Brand Name">
            <button class="btn m-2" type="submit">Add</button>
        </div>
    </form>
</div>
</div>
</dialog>
