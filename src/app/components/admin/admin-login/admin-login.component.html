
    <div class="flex flex-col items-center justify-center h-screen">
<div class="bg-white p-8 rounded-lg shadow-lg w-96">
    <h2 class="text-2xl font-bold text-center mb-6">Admin Login</h2>
<form [formGroup]="form" (ngSubmit)="submit()">
    <div class="mb-4">
        <label class="block text-gray-700 font-semibold mb-2" for="email">Email</label>
        <input type="email" id="email" placeholder="Enter Email" formControlName="email" name="email" id='email'
        class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
    </div>
    <div class="mb-4">
        <label class="block text-gray-700 font-semibold mb-2" for="password">Password</label>
        <input  type="password" id="password" placeholder="Enter your password" formControlName="password" name="password"
        class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
    </div>

  <button type="submit"
  class="w-full bg-blue-500 text-white font-semibold py-2 rounded-lg hover:bg-blue-600 transition duration-200">
LOGIN
  </button>

</form>
<button [routerLink]="['/home']"
class="w-full bg-red-500 text-white font-semibold mt-2 py-2 rounded-lg hover:bg-red-600 transition duration-200">
BACK TO HOME
</button>
</div>
    </div>
