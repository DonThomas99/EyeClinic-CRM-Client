<app-header></app-header>
<div class="min-h-screen bg-gray-100 p-6">
    <div class="max-w-7xl mx-auto">
      <h1 class="text-3xl font-bold mb-6 text-center text-gray-800">Our Products</h1>
  
      <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
        <div *ngFor="let product of products" class="bg-white shadow-lg rounded-2xl overflow-hidden transition-transform transform hover:scale-105">
          <img
            [src]="product.images[0]"
            alt="{{ product.name }}"
            class="w-full h-48 object-cover"
          />
  
          <div class="p-4">
            <h2 class="text-xl font-semibold text-gray-800">{{ product.name }}</h2>
            <p class="text-sm text-gray-600 mt-1">{{ product.description | slice:0:60 }}...</p>
  
            <div class="flex justify-between items-center mt-4">
              <span class="text-lg font-bold text-green-600">₹{{ product.price }}</span>
              <span class="text-sm bg-blue-100 text-blue-800 px-2 py-1 rounded-full">{{ product.category.name }}</span>
            </div>
  
            <div class="mt-2 text-sm text-gray-500">Brand: {{ product.brand.name }}</div>
          </div>
        </div>
      </div>
    </div>
  </div>
  
<app-footer></app-footer>
