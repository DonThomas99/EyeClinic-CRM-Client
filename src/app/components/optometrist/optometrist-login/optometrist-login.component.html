<div class="flex items-center justify-center min-h-screen bg-gray-100">
    <div class="bg-white shadow-lg rounded-lg p-8 w-96">
      <h2 class="text-2xl font-bold text-center text-blue-600 mb-6">Optometrist Login</h2>
  
      <!-- Email Input -->
      <div class="mb-4">
        <label class="block text-gray-700 text-sm font-medium mb-2" for="email">Email</label>
        <input type="email" id="email" 
               class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400" 
               placeholder="Enter your email" required />
      </div>
  
      <!-- Password Input -->
      <div class="mb-4">
        <label class="block text-gray-700 text-sm font-medium mb-2" for="password">Password</label>
        <input type="password" id="password"  
               class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400" 
               placeholder="Enter your password" required />
      </div>
  
      <!-- Error Message -->
      <p *ngIf="errorMessage" class="text-red-500 text-sm text-center mb-4">{{ errorMessage }}</p>
  
      <!-- Buttons -->
      <div class="flex justify-between">
        <button (click)="onLogin()" 
                class="bg-blue-500 hover:bg-blue-600 text-white font-medium py-2 px-4 rounded-lg w-1/2">
          Login
        </button>
        
        <button [routerLink]="['/home']"
                class="bg-gray-500 hover:bg-gray-600 text-white font-medium py-2 px-4 rounded-lg w-1/2 ml-2">
          Back to Home
        </button>
      </div>
    </div>
  </div>
