<div class="flex items-center justify-center min-h-screen bg-gray-100">
    <div class="w-full max-w-md bg-white p-6 rounded-2xl shadow-lg">
      <h2 class="text-2xl font-bold text-center text-gray-700 mb-6">Staff Login</h2>
  
      <form (ngSubmit)="onLogin()" class="space-y-4">
        <!-- Email Input -->
        <div>
          <label for="email" class="block text-sm font-medium text-gray-600">Email</label>
          <input
            type="email"
            id="email"
            name="email"
            required
            class="w-full px-4 py-2 mt-1 text-gray-700 border rounded-lg focus:ring focus:ring-blue-200 focus:outline-none"
          />
        </div>
  
        <!-- Password Input -->
        <div>
          <label for="password" class="block text-sm font-medium text-gray-600">Password</label>
          <input
            type="password"
            id="password"name="password"
            required
            class="w-full px-4 py-2 mt-1 text-gray-700 border rounded-lg focus:ring focus:ring-blue-200 focus:outline-none"
          />
        </div>
  
        <!-- Login Button -->
        <button
          type="submit"
          class="w-full px-4 py-2 text-white bg-blue-600 rounded-lg hover:bg-blue-700 focus:ring focus:ring-blue-300"
        >
          Login
        </button>
  
        <!-- Error Message -->
        <p *ngIf="errorMessage" class="text-red-500 text-sm text-center mt-2">{{ errorMessage }}</p>
      </form>
      <button
      [routerLink]="['/home']"
      class="w-full mt-3 px-4 py-2 text-white bg-red-600 rounded-lg hover:bg-red-700 focus:ring focus:ring-blue-300"
    >
      BACK TO HOME
    </button>
    </div>
  </div>
