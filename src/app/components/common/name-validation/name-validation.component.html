<div class="name" *ngIf="isSubmitted && nameControl && nameControl.errors">
    <div *ngIf="nameControl.errors['required']" class="text-red-500">Name is required</div>
    <div *ngIf="nameControl.errors['minlength']">Name must contain at least {{nameControl.errors['minlength'].requiredLength}} characters</div>
    <div *ngIf="nameControl.errors['maxlength']">Name must not exceed {{nameControl.errors['maxlength'].requiredLength}} characters</div>
    <div *ngIf="nameControl.errors['pattern'] && !nameControl.errors['minlength'] && !nameControl.errors['maxlength']">
      Name should only contain alphabets
    </div>
  </div>
