<div class="flex justify-center items-center bg-gray-100">
    <form [formGroup]="EditItemForm" (ngSubmit)="onSubmit()" 
          class="w-full max-w-lg bg-white shadow-md rounded-2xl p-6 space-y-5">
      <h2 class="text-2xl font-semibold text-center text-gray-700">{{data.title}}</h2>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Name</label>
        <input formControlName="name" type="text" 
               class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring focus:ring-blue-200">
      </div>
      <div>
        <app-name-validation> [nameControl]="EditItemForm.get('name')" [isSubmitted]="isSubmitted"</app-name-validation>
      </div>
  
      <div class="flex justify-evenly">
        <button type="button" 
                (click)="closeComponent(); $event.stopPropagation()"
                class="bg-red-600 btn text-white font-medium py-2 px-6 rounded-lg hover:bg-red-700 cursor-pointer">
          Close
        </button>
        <button type="submit" 
                class="bg-blue-600 text-white font-medium py-2 px-6 rounded-lg hover:bg-blue-700 cursor-pointer transition disabled:opacity-50" 
                >
          Update {{data.Item}}
        </button>
      </div>
    </form>
  </div>
