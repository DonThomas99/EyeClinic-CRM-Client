<div class="flex justify-center items-center min-h-screen bg-gray-100 p-4">
  <form 
    [formGroup]="EditProductForm"
    (ngSubmit)="onSubmit()"
    enctype="multipart/form-data"
    class="w-full max-w-lg bg-white shadow-md rounded-2xl p-6 space-y-5"
  >
    <h2 class="text-2xl font-semibold text-center text-gray-700 mb-4">Edit Product</h2>

    <!-- Product Name -->
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Name</label>
      <input
        formControlName="name"
        type="text"
        class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring focus:ring-blue-200"
      />
    </div>

    <!-- Category and Brand -->
    <div class="flex gap-4">
      <div class="w-1/2">
        <label class="block text-sm font-medium text-gray-700 mb-1">Category</label>
        <select
          formControlName="category"
          class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring focus:ring-blue-200"
        >
          <option value="">Select category</option>
          <option *ngFor="let cat of categories" [value]="cat._id">{{ cat.name }}</option>
        </select>
      </div>

      <div class="w-1/2">
        <label class="block text-sm font-medium text-gray-700 mb-1">Brand</label>
        <select
          formControlName="brand"
          class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring focus:ring-blue-200"
        >
          <option value="">Select brand</option>
          <option *ngFor="let br of brands" [value]="br._id">{{ br.name }}</option>
        </select>
      </div>
    </div>

    <!-- Images -->
    <div>
      <div class="flex justify-between items-center mb-2">
        <label class="block text-sm font-medium text-gray-700">Images (max 4)</label>
        <button
          type="button"
          (click)="viewImages()"
          class="text-sm text-blue-600 hover:underline focus:outline-none"
        >
          View Images
        </button>
      </div>

      <input
        type="file"
        (change)="onFileChange($event)"
        multiple
        class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4
               file:rounded-full file:border-0
               file:text-sm file:font-semibold
               file:bg-blue-50 file:text-blue-700
               hover:file:bg-blue-100"
      />
    </div>

    <!-- Price and Stock -->
    <div class="flex gap-4">
      <div class="w-1/2">
        <label class="block text-sm font-medium text-gray-700 mb-1">Price</label>
        <input
          formControlName="price"
          type="number"
          class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring focus:ring-blue-200"
        />
      </div>

      <div class="w-1/2">
        <label class="block text-sm font-medium text-gray-700 mb-1">Stock</label>
        <input
          formControlName="stock"
          type="number"
          class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring focus:ring-blue-200"
        />
      </div>
    </div>

    <!-- Description -->
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Description</label>
      <textarea
        formControlName="description"
        rows="3"
        class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring focus:ring-blue-200 resize-none"
      ></textarea>
    </div>

    <!-- Actions -->
    <div class="flex justify-evenly">
      <button (click)="closeComponent()" class="bg-red-600 btn text-white font-medium py-2 px-6 rounded-lg hover:bg-red-700 cursor-pointer">
          Close
      </button>
      <button 
        type="submit"
        class="bg-blue-600 text-white font-medium py-2 px-6 rounded-lg hover:bg-blue-700 transition disabled:opacity-50"
      >
        Update Product
      </button>
    </div>
  </form>
</div>

<!-- Image Modal -->
<dialog id="view-images" class="modal" style="min-height: 50vh;">
  <div class="modal-box custom-modal-size">
    <div *ngIf="sanitizedUrls && sanitizedUrls.length > 0"
         class="url-container mt-10 flex flex-row overflow-x-auto whitespace-nowrap space-x-4">
      <div *ngFor="let url of sanitizedUrls; let i = index" class="relative inline-block">
        <button
          class="absolute top-2 right-2 text-white bg-red-600 hover:bg-red-700 rounded-full p-1 z-10"
          (click)="deleteImage(i)"
          title="Delete image"
        >
          ✕
        </button>
        <iframe [src]="url" width="200" height="200" class="inline-block rounded border shadow"></iframe>
      </div>
    </div>
    <form method="dialog">
      <button class="btn btn-sm btn-circle btn-ghost absolute right-2 top-2">✕</button>
    </form>
  </div>
</dialog>
